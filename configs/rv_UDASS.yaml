DEVICE          : cuda              # device used for training and evaluation (cpu, cuda, cuda0, cuda1, ...)
SAVE_DIR        : 'output_adapt'          # output folder name used for saving the model, logs and inference results

MODEL:
  NAME          : CMNeXt                                            # name of the model you are using
  BACKBONE      : CMNeXt-B2                                         # model variant
  PRETRAINED    : 'weight/target-domain-udass_model.pth'    # source-domain model's weight
  RESUME        : ''   # checkpoint file
  ADAPT         : True

DATASET:
  NAME          : Mydata_adapt                                        # dataset name to be trained with (camvid, cityscapes, ade20k)
  ROOT          : 'data/traget-domain_rv'        # dataset root path
  IGNORE_LABEL  : 255
  MODALS        : ['img', 'building_height', 'osm_building', 'ndvi']

TRAIN:
  IMAGE_SIZE    : [512, 512]    # training image size in (h, w)
  BATCH_SIZE    : 2               # batch size used to train
  EPOCHS        : 10             # number of epochs to train
  EVAL_START    : 0           # evaluation interval start
  EVAL_INTERVAL : 1               # evaluation interval during training
  AMP           : false           # use AMP in training
  DDP           : false           # use DDP training
  PLCStratey    : SkeLine_connected_SLIC  #SkePoint_prompted_BufSAM #SkeLine_connected_SLIC  # select UDASS strategy

LOSS:
  NAME          : OhemCrossEntropy # loss function name
  CLS_WEIGHTS   : false            # use class weights in loss calculation

OPTIMIZER:
  NAME          : adamw           # optimizer name
  LR            : 0.00004         # initial learning rate used in optimizer
  WEIGHT_DECAY  : 0.01            # decay rate used in optimizer

SCHEDULER:
  NAME          : warmuppolylr    # scheduler name
  POWER         : 0.9             # scheduler power
  WARMUP        : 0               # warmup epochs used in scheduler
  WARMUP_RATIO  : 0.1             # warmup ratio

EVAL:
  MODEL_PATH    : 'weight/target-domain-udass_model.pth'    # trained model file path
  IMAGE_SIZE    : [512, 512]                            # evaluation image size in (h, w)
  BATCH_SIZE    : 4                                       # batch size used to train
  MSF:
    ENABLE      : false                                   # multi-scale and flip evaluation
    FLIP        : false                                   # use flip in evaluation
    SCALES      : [1.0]       # scales used in MSF evaluation


TEST:
  MODEL_PATH    : 'weight/target-domain-udass_model.pth'    # trained model file path
  FILE          : 'data/traget-domain_rv'     # filename or foldername
  IMAGE_SIZE    : [512, 512]                            # inference image size in (h, w)
  OVERLAY       : false                                   # save the overlay result (image_alpha+label_alpha)